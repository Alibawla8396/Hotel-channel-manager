<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hotel Family Stay - Channel Manager</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f6f9;
  color:#172033;
}

header{
  background:#172033;
  color:white;
  padding:18px 25px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  position:sticky;
  top:0;
  z-index:20;
}

header h1{
  margin:0;
  font-size:24px;
}

.hotel-name{
  font-size:18px;
}

.container{
  padding:20px;
  max-width:1600px;
  margin:auto;
}

.cards{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:15px;
}

.card{
  background:white;
  padding:20px;
  border-radius:12px;
  box-shadow:0 2px 8px #0001;
}

.card h3{
  margin:0 0 10px;
  font-size:15px;
  color:#667085;
}

.card .number{
  font-size:28px;
  font-weight:bold;
}

.section{
  background:white;
  margin-top:20px;
  padding:20px;
  border-radius:12px;
  box-shadow:0 2px 8px #0001;
}

.section-title{
  font-size:22px;
  font-weight:bold;
  margin-bottom:15px;
}

button{
  border:0;
  padding:9px 13px;
  border-radius:7px;
  cursor:pointer;
  font-weight:bold;
}

button:hover{
  opacity:.9;
}

button:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.view-buttons{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin-bottom:12px;
}

.view-buttons button{
  background:#e8edf5;
}

.view-buttons button.active{
  background:#172033;
  color:white;
}

.calendar-controls{
  display:flex;
  gap:8px;
  align-items:center;
  flex-wrap:wrap;
  margin-bottom:12px;
}

.calendar-controls button{
  background:#e8edf5;
  color:#172033;
}

.calendar-controls .today-btn{
  background:#1769aa;
  color:white;
}

.calendar-title{
  font-weight:bold;
  font-size:16px;
  margin-left:5px;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:15px;
}

th,
td{
  border:1px solid #ddd;
  padding:10px;
  text-align:center;
}

th{
  background:#172033;
  color:white;
}

.available{
  background:#e8f8ef;
  color:#16834b;
  font-weight:bold;
}

.booked{
  background:#ffe8e8;
  color:#c62828;
  font-weight:bold;
}

.blocked{
  background:#fff2d8;
  color:#a56700;
  font-weight:bold;
}

.action{
  background:#d32f2f;
  color:white;
}

.edit-btn{
  background:#1769aa;
  color:white;
}

.cancel-btn{
  background:#d32f2f;
  color:white;
}

.block-btn{
  background:#a56700;
  color:white;
}

.unblock-btn{
  background:#16834b;
  color:white;
}

.save-btn{
  background:#16834b;
  color:white;
}

.clear-btn{
  background:#777;
  color:white;
}

.view-btn{
  background:#667085;
  color:white;
}

.small-btn{
  padding:6px 9px;
  font-size:12px;
}

.calendar-wrap{
  width:100%;
  overflow-x:auto;
  border:1px solid #ddd;
  border-radius:8px;
}

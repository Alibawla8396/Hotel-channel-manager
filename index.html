<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hotel Family Stay - Channel Manager</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f6f9;
  color:#172033;
}
header{
  background:#172033;
  color:white;
  padding:18px 25px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
header h1{margin:0;font-size:24px}
.hotel-name{font-size:18px}

.container{padding:20px;max-width:1400px;margin:auto}

.cards{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
}
.card{
  background:white;
  padding:20px;
  border-radius:12px;
  box-shadow:0 2px 8px #0001;
}
.card h3{margin:0 0 10px;font-size:15px;color:#667085}
.card .number{font-size:28px;font-weight:bold}

.section{
  background:white;
  margin-top:20px;
  padding:20px;
  border-radius:12px;
  box-shadow:0 2px 8px #0001;
}

.section-title{
  font-size:22px;
  font-weight:bold;
  margin-bottom:15px;
}

button{
  border:0;
  padding:10px 15px;
  border-radius:7px;
  cursor:pointer;
  font-weight:bold;
}

.view-buttons button{
  background:#e8edf5;
  margin-right:7px;
}
.view-buttons button.active{
  background:#172033;
  color:white;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:15px;
}
th,td{
  border:1px solid #ddd;
  padding:10px;
  text-align:center;
}
th{
  background:#172033;
  color:white;
}

.available{background:#e8f8ef;color:#16834b;font-weight:bold}
.booked{background:#ffe8e8;color:#c62828;font-weight:bold}
.blocked{background:#fff2d8;color:#a56700;font-weight:bold}

.action{
  background:#d32f2f;
  color:white;
}

.calendar-wrap{
  overflow-x:auto;
}

.calendar td{
  min-width:105px;
  height:65px;
}

.date-head{
  font-size:12px;
}

.status-btn{
  width:90%;
  padding:7px;
  font-size:12px;
}

.booking-form{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
}

input,select{
  width:100%;
  padding:11px;
  border:1px solid #ccc;
  border-radius:7px;
}

.save-btn{
  background:#16834b;
  color:white;
}

.clear-btn{
  background:#777;
  color:white;
}

@media(max-width:800px){
  .cards{grid-template-columns:repeat(2,1fr)}
  .booking-form{grid-template-columns:1fr}
  header{display:block}
  .hotel-name{margin-top:8px}
}
/* Jio-style Booking Calendar */
.calendar-wrap {
    width: 100%;
    overflow-x: auto;
}

.calendar {
    width: max-content;
    min-width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
}

.calendar th,
.calendar td {
    border: 1px solid #ddd;
    text-align: center;
    padding: 8px;
    min-width: 120px;
    height: 65px;
}

.calendar th {
    background: #172033;
    color: white;
    font-weight: bold;
}

.calendar th:first-child,
.calendar td:first-child {
    position: sticky;
    left: 0;
    z-index: 3;
    min-width: 130px;
    width: 130px;
    background: white;
    color: #172033;
    font-weight: bold;
}

.calendar th:first-child {
    background: #172033;
    color: white;
    z-index: 4;
}

.calendar .date-head {
    font-size: 12px;
    display: block;
    margin-top: 3px;
}

.calendar .status-btn {
    width: 90%;
    padding: 8px 4px;
    font-size: 12px;
    border-radius: 6px;
}

.calendar td.available {
    background: #e8f8ef;
    color: #16834b;
}

.calendar td.booked {
    background: #ffe8e8;
    color: #c62828;
}

.calendar td.blocked {
    background: #fff2d8;
    color: #a56700;
}

.calendar button.available {
    background: #e8f8ef;
    color: #16834b;
}

.calendar button.booked {
    background: #ffe8e8;
    color: #c62828;
}

.calendar button.blocked {
    background: #fff2d8;
    color: #a56700;
}
</style>
  

</head>

<body>

<header>
  <h1>🏨 Hotel Channel Manager</h1>
  <div class="hotel-name">Hotel Family Stay</div>
</header>

<div class="container">

<div class="cards">
  <div class="card">
    <h3>Total Rooms</h3>
    <div class="number">3</div>
  </div>

  <div class="card">
    <h3>Available</h3>
    <div class="number" id="availableCount">3</div>
  </div>

  <div class="card">
    <h3>Booked</h3>
    <div class="number" id="bookedCount">0</div>
  </div>

  <div class="card">
    <h3>Today's Rate</h3>
    <div class="number">₹3800</div>
  </div>
</div>

<div class="section">
  <div class="section-title">📅 Booking Calendar</div>

  <div class="view-buttons">
    <button onclick="showDays(1,this)">1 Day</button>
    <button onclick="showDays(7,this)" class="active">7 Days</button>
    <button onclick="showDays(14,this)">14 Days</button>
    <button onclick="showDays(30,this)">30 Days</button>
  </div>

  <div class="calendar-wrap">
    <table class="calendar">
      <thead id="calendarHead"></thead>
      <tbody id="calendarBody"></tbody>
    </table>
  </div>
</div>

<div class="section">
  <div class="section-title">🛏️ Inventory & Rooms</div>

  <table>
    <thead>
      <tr>
        <th>Room</th>
        <th>Type</th>
        <th>Capacity</th>
        <th>Rate</th>
        <th>Status</th>
        <th>Action</th>
      </tr>
    </thead>

    <tbody id="roomTable"></tbody>
  </table>
</div>

<div class="section">
  <div class="section-title">➕ Add Booking</div>

  <div class="booking-form">

    <div>
      <label>Guest Name</label>
      <input id="guestName" placeholder="Guest name">
    </div>

    <div>
      <label>Room</label>
      <select id="bookingRoom">
        <option value="101">Room 101</option>
        <option value="102">Room 102</option>
        <option value="103">Room 103</option>
      </select>
    </div>

    <div>
      <label>Check-in</label>
      <input type="date" id="checkin">
    </div>

    <div>
      <label>Check-out</label>
      <input type="date" id="checkout">
    </div>

    <div>
      <label>Guests</label>
      <input type="number" id="guests" value="1" min="1">
    </div>

    <div>
      <label>Amount</label>
      <input type="number" id="amount" placeholder="₹ Amount">
    </div>

    <div style="display:flex;align-items:end;gap:8px">
      <button class="save-btn" onclick="addBooking()">Save Booking</button>
      <button class="clear-btn" onclick="clearForm()">Clear</button>
    </div>

  </div>
</div>

<div class="section">
  <div class="section-title">📋 Current Bookings</div>

  <table>
    <thead>
      <tr>
        <th>Guest</th>
        <th>Room</th>
        <th>Check-in</th>
        <th>Check-out</th>
        <th>Guests</th>
        <th>Amount</th>
      </tr>
    </thead>
    <tbody id="bookingTable"></tbody>
  </table>
</div>

</div>

<script>

const rooms=[
 {number:"101",type:"Family Room",capacity:6,rate:3800,status:"AVAILABLE"},
 {number:"102",type:"Double Bed Non-AC",capacity:3,rate:3200,status:"AVAILABLE"},
 {number:"103",type:"Triple Family",capacity:4,rate:3200,status:"AVAILABLE"}
];

let bookings=[];
bookings = JSON.parse(localStorage.getItem("hotelBookings") || "[]");
  bookings.forEach(b => {
    let room = rooms.find(r => r.number === b.room);
    if (room) {
        room.status = "BOOKED";
    }
});
function renderRooms(){

 let table=document.getElementById("roomTable");
 table.innerHTML="";

 rooms.forEach(room=>{

  let statusClass=
   room.status==="AVAILABLE"?"available":
   room.status==="BOOKED"?"booked":"blocked";

  table.innerHTML+=`
  <tr>
    <td>Room ${room.number}</td>
    <td>${room.type}</td>
    <td>${room.capacity}</td>
    <td>₹${room.rate}</td>
    <td class="${statusClass}">${room.status}</td>
    <td>
      <button class="action" onclick="toggleBlock('${room.number}')">
      ${room.status==="BLOCKED"?"Unblock":"Block Room"}
      </button>
    </td>
  </tr>`;
 });

 updateCounts();
}

function updateCounts(){

 let available=rooms.filter(r=>r.status==="AVAILABLE").length;
 let booked=rooms.filter(r=>r.status==="BOOKED").length;

 document.getElementById("availableCount").innerText=available;
 document.getElementById("bookedCount").innerText=booked;
}

function toggleBlock(number){

 let room=rooms.find(r=>r.number===number);

 if(room.status==="BLOCKED"){
   room.status="AVAILABLE";
 }else{
   room.status="BLOCKED";
 }

 renderRooms();
 renderCalendar();
}

function showDays(days,button){

 document.querySelectorAll(".view-buttons button")
 .forEach(b=>b.classList.remove("active"));

 button.classList.add("active");

 renderCalendar(days);
}

function formatDate(date){

 let d=date.getDate().toString().padStart(2,"0");
 let m=(date.getMonth()+1).toString().padStart(2,"0");
 let y=date.getFullYear();

 return `${d}/${m}/${y}`;
}

function getDateKey(date){

 let y=date.getFullYear();
 let m=(date.getMonth()+1).toString().padStart(2,"0");
 let d=date.getDate().toString().padStart(2,"0");

 return `${y}-${m}-${d}`;
}

function renderCalendar(days=7){

 let head=document.getElementById("calendarHead");
 let body=document.getElementById("calendarBody");

 head.innerHTML="<tr><th>Room</th>";
 
 let dates=[];

 for(let i=0;i<days;i++){

   let date=new Date();
   date.setDate(date.getDate()+i);

   dates.push(date);

   head.innerHTML+=`
   <th>
    ${date.toLocaleDateString("en-IN",{weekday:"short"})}<br>
    <span class="date-head">${formatDate(date)}</span>
   </th>`;
 }

 head.innerHTML+="</tr>";

 body.innerHTML="";

 rooms.forEach(room=>{

   let row=`<tr><td><b>Room ${room.number}</b></td>`;

   dates.forEach(date=>{

     let key=getDateKey(date);

     let booking=bookings.find(
       b=>b.room===room.number &&
       key>=b.checkin &&
       key<b.checkout
     );

     if(booking){

       row+=`
       <td class="booked">
         <button class="status-btn booked"
         onclick="alert('Guest: ${booking.guest}')">
         BOOKED
         </button>
       </td>`;

     }else if(room.status==="BLOCKED"){

       row+=`
       <td class="blocked">
         <button class="status-btn blocked">
         BLOCKED
         </button>
       </td>`;

     }else{

       row+=`
       <td class="available">
         <button class="status-btn available"
         onclick="quickBook('${room.number}','${key}')">
         AVAILABLE
         </button>
       </td>`;
     }

   });

   row+="</tr>";

   body.innerHTML+=row;
 });
}

function quickBook(room,date){

 document.getElementById("bookingRoom").value=room;
 document.getElementById("checkin").value=date;

 let next=new Date(date);
 next.setDate(next.getDate()+1);

 document.getElementById("checkout").value=getDateKey(next);

 document.getElementById("guestName").focus();
}

function addBooking(){

 let guest=document.getElementById("guestName").value;
 let room=document.getElementById("bookingRoom").value;
 let checkin=document.getElementById("checkin").value;
 let checkout=document.getElementById("checkout").value;
 let guests=document.getElementById("guests").value;
 let amount=document.getElementById("amount").value;

 if(!guest || !checkin || !checkout){

   alert("Please fill Guest Name, Check-in and Check-out.");
   return;
 }

 bookings.push({
   guest,
   room,
   checkin,
   checkout,
   guests,
   amount
 });
localStorage.setItem("hotelBookings", JSON.stringify(bookings));
  
 let selectedRoom=rooms.find(r=>r.number===room);

 if(selectedRoom){
   selectedRoom.status="BOOKED";
 }

 renderRooms();
 renderBookings();
 renderCalendar();

 alert("Booking saved successfully!");

 clearForm();
}

function renderBookings(){

 let table=document.getElementById("bookingTable");
 table.innerHTML="";

 bookings.forEach(b=>{

   table.innerHTML+=`
   <tr>
     <td>${b.guest}</td>
     <td>Room ${b.room}</td>
     <td>${b.checkin}</td>
     <td>${b.checkout}</td>
     <td>${b.guests}</td>
     <td>₹${b.amount || 0}</td>
   </tr>`;
 });
}

function clearForm(){

 document.getElementById("guestName").value="";
 document.getElementById("checkin").value="";
 document.getElementById("checkout").value="";
 document.getElementById("guests").value="1";
 document.getElementById("amount").value="";
}

renderRooms();
renderCalendar(7);
renderBookings();

</script>

</body>
</html>
